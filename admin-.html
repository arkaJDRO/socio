<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Socio Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1e;--panel:#151830;--panel2:#1c2040;--line:#262b52;--txt:#eef0ff;--mut:#8b90b8;--a:#7c5cff;--g:linear-gradient(135deg,#7c5cff,#ff5c9d);--in:#20264d;--bad:#ff8fa8;--ok:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sora',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;font-size:16px;color:var(--txt);background:var(--in);border:1px solid transparent;border-radius:12px;padding:11px 14px;width:100%;outline:none}input:focus{border-color:var(--a)}
.hide{display:none!important}.sub{color:var(--mut);font-size:12px}
.logo{font-size:22px;font-weight:700;letter-spacing:-1px}.logo span{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}.logo small{font-size:11px;color:var(--mut);letter-spacing:0;margin-left:6px;font-weight:600}
.btn{background:var(--g);border-radius:12px;padding:11px 16px;font-weight:600}.btn.gh{background:var(--in)}.btn.dg{background:#ff5c7a22;color:var(--bad)}.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:12px;width:100%;max-width:400px}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}.err{color:var(--bad);font-size:13px;min-height:16px}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}nav button{padding:8px 14px;border-radius:10px;color:var(--mut);font-weight:600}nav button.on{background:var(--in);color:var(--txt)}
#qw{width:220px}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:26px;display:block}.stat span{color:var(--mut);font-size:12px}
.sec{color:var(--mut);font-size:12px;font-weight:600;margin-top:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.row.click{cursor:pointer}.row.click:hover{background:var(--panel2)}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.av.big{width:84px;height:84px;font-size:32px}
.th{width:54px;height:54px;border-radius:10px;background:var(--in);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--mut);font-size:11px}.th img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 12px;border-radius:20px;background:var(--in);color:var(--mut);font-size:12px;font-weight:600}.chip.on{background:var(--g);color:#fff}
.tag{font-size:10px;font-weight:700;border-radius:8px;padding:2px 7px;margin-left:6px;background:var(--in);color:var(--mut)}.tag.bad{background:#ff5c7a22;color:var(--bad)}
.vt{display:inline-flex;vertical-align:-3px;margin-left:4px;width:15px;height:15px}.vt svg{width:100%;height:100%}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
#dlg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:20}#dc{max-width:560px;max-height:92vh;overflow-y:auto}
.head{display:grid;justify-items:center;gap:4px;text-align:center}.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{background:var(--in);border-radius:12px;padding:8px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis}.info small{display:block;color:var(--mut);font-size:11px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:20px;z-index:50}
.empty{color:var(--mut);text-align:center;padding:30px}
.adstage{position:relative;width:300px;height:533px;margin:0 auto;border-radius:20px;overflow:hidden;border:1px solid var(--line);touch-action:none;background:#151830}
.adel{position:absolute;transform:translate(-50%,-50%);cursor:grab;user-select:none;text-align:center;max-width:88%;line-height:1.3;white-space:pre-wrap;z-index:1}
.adel.btnel{white-space:nowrap;box-shadow:0 6px 18px #0006}
.adel.sel{outline:2px dashed #fff;outline-offset:5px}
.adtools{display:flex;gap:8px;flex-wrap:wrap}
.adpanel{background:var(--in);border-radius:14px;padding:14px;display:grid;gap:10px}
.swrow2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=color]{width:40px;height:32px;padding:2px;border-radius:8px;cursor:pointer;background:var(--panel)}
input[type=range]{accent-color:var(--a)}
</style>
</head>
<body>
<section id="auth" class="hide"><div class="card">
  <div class="logo">soci<span>o</span><small>ADMIN</small></div>
  <div class="sub" id="asub"></div>
  <input id="nm" class="hide" placeholder="Your name" autocomplete="name">
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <input id="ic" class="hide" placeholder="Invite code (empty if you're the first admin)" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <div class="err" id="err"></div>
  <button class="btn" id="go">Sign in</button>
  <button class="btn gh" id="goog">Continue with Google</button>
  <button class="sub" id="swap" style="text-align:center"></button>
</div></section>
<section id="app" class="hide">
  <header><div class="logo">soci<span>o</span><small>ADMIN</small></div><nav id="nav"></nav><div id="qw" class="hide"><input id="q" placeholder="Search…"></div><button class="btn gh sm" id="out">Sign out</button></header>
  <main id="main"></main>
</section>
<div id="dlg" class="hide"><div class="card" id="dc"></div></div>
<div id="toast" class="hide"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

const app = initializeApp({ apiKey: "AIzaSyA2N6Ku_z1eu4M-6ROgr07RNiXOgBnoo4E", authDomain: "chatbro-b8cde.firebaseapp.com", databaseURL: "https://chatbro-b8cde-default-rtdb.firebaseio.com", projectId: "chatbro-b8cde", storageBucket: "chatbro-b8cde.firebasestorage.app", messagingSenderId: "867020468309", appId: "1:867020468309:web:1ee8a6a501fb798c88a4dc" }, "admin");
const auth = getAuth(app), db = getDatabase(app);
const $ = s => document.querySelector(s), h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

const vt = () => { const s = h("span", "vt"); s.innerHTML = '<svg viewBox="0 0 24 24"><g fill="#3897f0"><rect x="4" y="4" width="16" height="16" rx="4.5"/><rect x="4" y="4" width="16" height="16" rx="4.5" transform="rotate(45 12 12)"/></g><path d="M8.2 12.3l2.6 2.6 5-5.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; return s; };
const ago = t => { const n = (Date.now() - (t || Date.now())) / 1000; return n < 60 ? "just now" : n < 3600 ? Math.floor(n / 60) + "m ago" : n < 86400 ? Math.floor(n / 3600) + "h ago" : new Date(t).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" }); };
const toast = t => { const e = $("#toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add("hide"), 2600); };

let AD = {}, INV = {}, me, U = {}, V = {}, B = {}, P = {}, S = {}, G = {}, LOG = {}, FC = {}, ADS = {}, ADV = {}, tab = "over", flt = "all", dlgId = null, adEditId = null, adBg = null, adEls = [], adSelId = null, unsubs = [], rq;
const nm = id => (U[id] || {}).name || (U[id] || {}).email || id || "Unknown";
const log = (a, t) => push(ref(db, "adminLog"), { by: me.uid, a, t: t || null, ts: serverTimestamp() }).catch(() => {});
const TABS = [["over", "Overview"], ["users", "Users"], ["posts", "Posts"], ["groups", "Groups"], ["ads", "Ads"], ["team", "Team"]];
function pickImgFile(cb) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(f); };
  inp.click();
}

/* ---------- auth + admin sign-up ---------- */
let signup = false, signing = false, myRole = "admin";
const setMode = s => { signup = s; ["#nm", "#ic"].forEach(q => $(q).classList.toggle("hide", !s)); $("#go").textContent = s ? "Create admin account" : "Sign in";
  $("#swap").innerHTML = s ? "Already an admin? <b>Sign in</b>" : "Need an admin account? <b>Create one</b>";
  $("#asub").textContent = s ? "Got an invite code from an owner? Enter it below. If no admin exists yet, leave it empty and you'll become the owner." : "Sign in with an admin account."; $("#err").textContent = ""; };
$("#swap").onclick = () => setMode(!signup); setMode(false);
const nice = e => (e.code || e.message || "Something went wrong").replace("auth/", "").replace(/-/g, " ");
async function redeem(u, name, code, created) {
  try {
    if (code) {
      const iv = (await get(ref(db, "adminInvites/" + code))).val();
      if (!iv) throw new Error("That invite code isn't valid."); if (iv.used) throw new Error("That invite code was already used."); if (iv.exp < Date.now()) throw new Error("That invite code has expired.");
      await update(ref(db), { ["admins/" + u.uid]: { role: "admin", name, email: u.email || "", invite: code, ts: serverTimestamp() }, [`adminInvites/${code}/used`]: true, [`adminInvites/${code}/usedBy`]: u.uid });
    } else await set(ref(db, "admins/" + u.uid), { role: "owner", name, email: u.email || "", ts: serverTimestamp() });
  } catch (e) {
    if (created) await deleteUser(u).catch(() => {}); await signOut(auth).catch(() => {});
    throw new Error(/permission/i.test((e.code || "") + e.message) ? (code ? "Couldn't use that code." : "An admin already exists — ask an owner for an invite code.") : e.message);
  }
}
async function signUpFlow(getUser, name, code) {
  signing = true; $("#err").textContent = "";
  try { const { user, created } = await getUser(); await redeem(user, name || user.displayName || "Admin", code, created); signing = false; await gate(user); }
  catch (e) { $("#err").textContent = e.code ? nice(e) : e.message; } finally { signing = false; }
}
$("#go").onclick = () => {
  const em = $("#em").value.trim(), pw = $("#pw").value, name = $("#nm").value.trim(), code = $("#ic").value.trim().toUpperCase();
  if (!signup) return signInWithEmailAndPassword(auth, em, pw).catch(e => $("#err").textContent = nice(e));
  if (!name) return $("#err").textContent = "Enter your name.";
  signUpFlow(async () => { try { return { user: (await createUserWithEmailAndPassword(auth, em, pw)).user, created: true }; } catch (e) { if (e.code !== "auth/email-already-in-use") throw e; return { user: (await signInWithEmailAndPassword(auth, em, pw)).user, created: false }; } }, name, code);
};
$("#goog").onclick = () => signup ? signUpFlow(async () => ({ user: (await signInWithPopup(auth, new GoogleAuthProvider())).user, created: false }), $("#nm").value.trim(), $("#ic").value.trim().toUpperCase())
  : signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $("#err").textContent = nice(e));
$("#out").onclick = () => signOut(auth);
onAuthStateChanged(auth, async u => {
  if (signing) return;
  unsubs.forEach(f => f()); unsubs = []; me = null; $("#dlg").classList.add("hide");
  if (!u) { $("#app").classList.add("hide"); $("#auth").classList.remove("hide"); return; }
  await gate(u);
});
async function gate(u) {
  let v = null; try { v = (await get(ref(db, "admins/" + u.uid))).val(); } catch {}
  if (!v) { $("#err").textContent = "This account isn't an admin yet. Choose “Create one” and enter an invite code. (uid: " + u.uid + ")"; await signOut(auth); $("#auth").classList.remove("hide"); return; }
  myRole = v === true || v.role === "owner" ? "owner" : "admin"; me = u; $("#auth").classList.add("hide"); $("#app").classList.remove("hide"); start();
}
function start() {
  const sub = (path, fn, q) => unsubs.push(onValue(q || ref(db, path), s => { fn(s.val() || {}); render(); }, e => toast("Can't read " + path + ": " + (e.code || e.message))));
  sub("users", v => U = v); sub("verified", v => V = v); sub("banned", v => B = v); sub("posts", v => P = v); sub("stories", v => S = v); sub("groups", v => G = v);
  sub("admins", v => AD = v); if (myRole === "owner") sub("adminInvites", v => INV = v);
  sub("ads", v => ADS = v); sub("adViews", v => ADV = v);
  sub("adminLog", v => LOG = v, query(ref(db, "adminLog"), limitToLast(25)));
}
const render = () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(draw); };
$("#q").oninput = render;

/* ---------- views ---------- */
function draw() {
  if (!me) return;
  $("#nav").innerHTML = ""; TABS.forEach(([k, l]) => { const b = h("button", tab === k ? "on" : "", l); b.onclick = () => { tab = k; $("#q").value = ""; render(); }; $("#nav").append(b); });
  $("#qw").classList.toggle("hide", tab === "over" || tab === "team" || tab === "ads");
  const M = $("#main"); M.innerHTML = ""; ({ over: vOver, users: vUsers, posts: vPosts, groups: vGroups, ads: vAds, team: vTeam })[tab](M);
  if (dlgId) userDlg(dlgId);
}
const live = uid => Object.values(S[uid] || {}).filter(t => Date.now() - (t.ts || Date.now()) < 864e5).length;
function vOver(M) {
  const st = h("div", "stats"), n = k => Object.keys(k).length;
  [["Users", n(U)], ["Online now", Object.values(U).filter(u => u.online).length], ["Blue ticks", Object.values(V).filter(Boolean).length], ["Suspended", n(B)], ["Posts", n(P)], ["Live stories", Object.keys(S).reduce((a, k) => a + live(k), 0)], ["Groups", n(G)]]
    .forEach(([l, v]) => { const c = h("div", "stat"); c.append(h("b", "", String(v)), h("span", "", l)); st.append(c); });
  M.append(st, h("div", "sec", "RECENT ADMIN ACTIVITY"));
  const L = Object.values(LOG).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (!L.length) M.append(h("div", "empty", "No admin actions yet."));
  L.forEach(e => { const r = h("div", "row"), t = h("div", "t"); t.append(h("b", "", nm(e.by) + " " + e.a), h("div", "sub", (e.t ? "Target: " + nm(e.t) + " · " : "") + ago(e.ts))); r.append(t); M.append(r); });
}
function userRow(id, u) {
  const r = h("div", "row click"), t = h("div", "t"), b = h("b", "", u.name || u.email || "Unknown");
  if (V[id]) b.append(vt()); if (B[id]) b.append(h("span", "tag bad", "SUSPENDED"));
  t.append(b, h("div", "sub", (u.username ? "@" + u.username + " · " : "") + (u.email || "")));
  r.append(av(u), t); if (u.online) r.append(h("span", "dot")); r.onclick = () => userDlg(id); return r;
}
function vUsers(M) {
  const chips = h("div", "chips"); [["all", "All"], ["verified", "Blue tick"], ["banned", "Suspended"], ["online", "Online"]].forEach(([k, l]) => { const c = h("button", "chip" + (flt === k ? " on" : ""), l); c.onclick = () => { flt = k; render(); }; chips.append(c); });

    .sort((a, b) => (+!!b[1].online) - (+!!a[1].online) || (a[1].name || "").localeCompare(b[1].name || ""));
  if (!L.length) M.append(h("div", "empty", "No users match."));
  L.slice(0, 200).forEach(([id, u]) => M.append(userRow(id, u))); if (L.length > 200) M.append(h("div", "empty", "Showing 200 of " + L.length + " — search to narrow down."));
}
function postRow(pid, p) {
  const r = h("div", "row"), th = h("div", "th"), t = h("div", "t"), it = (p.media || (p.img ? [{ url: p.img, kind: "image" }] : []))[0], u = U[p.uid] || {}, b = h("b", "", nm(p.uid));
  const src = it && (it.kind === "video" ? it.poster : it.url); if (src) { const i = document.createElement("img"); i.src = src; th.append(i); } else th.textContent = "text";
  if (V[p.uid]) b.append(vt());
  t.append(b, h("div", "sub", (p.text || "(no caption)").slice(0, 90)), h("div", "sub", `${Object.keys(p.likes || {}).length} likes · ${Object.keys(p.comments || {}).length} comments · ${ago(p.ts)}`));
  const d = h("button", "btn dg sm", "Delete"); d.onclick = () => run(() => remove(ref(db, "posts/" + pid)), "deleted a post by", p.uid, "Delete this post?");
  r.append(th, t, d); return r;
}
function vPosts(M) {
  const q = $("#q").value.trim().toLowerCase();
  const L = Object.entries(P).filter(([, p]) => !q || (p.text || "").toLowerCase().includes(q) || nm(p.uid).toLowerCase().includes(q)).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  if (!L.length) M.append(h("div", "empty", "No posts."));

}
function vGroups(M) {
  const q = $("#q").value.trim().toLowerCase();
  const L = Object.entries(G).filter(([, g]) => !q || (g.name || "").toLowerCase().includes(q));
  if (!L.length) M.append(h("div", "empty", "No groups."));
  L.forEach(([id, g]) => { const r = h("div", "row"), t = h("div", "t"), d = h("button", "btn dg sm", "Delete"); t.append(h("b", "", g.name || "Group"), h("div", "sub", Object.keys(g.members || {}).length + " members · created by " + nm(g.createdBy)));
    d.onclick = () => run(() => update(ref(db), { ["groups/" + id]: null, ["chats/" + id]: null }), "deleted group “" + g.name + "” by", g.createdBy, "Delete this group and its messages for everyone?"); r.append(av({ name: g.name, photo: g.photo }), t, d); M.append(r); });
}

/* ---------- ads (drag-and-drop, story-style editor) ---------- */
function resetAdEditor() { adBg = { type: "color", c1: "#151830" }; adEls = []; adSelId = null; }
function fontCss(f) {
  return { serif: "Georgia,'Times New Roman',serif", mono: "ui-monospace,'SF Mono',Menlo,monospace", rounded: "ui-rounded,-apple-system,'Segoe UI',sans-serif",
    condensed: "'Arial Narrow',Arial,sans-serif", impact: "Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif", cursive: "'Brush Script MT','Segoe Script',cursive" }[f] || "'Sora',system-ui,sans-serif";
}
function loadImgMeta(dataUrl, cb) { const img = new Image(); img.onload = () => cb(img.naturalWidth / img.naturalHeight || 1); img.onerror = () => cb(1); img.src = dataUrl; }
function bgStyle(node, bg) {
  [...node.children].filter(c => c.classList && c.classList.contains("adbgimg")).forEach(c => c.remove());
  if (bg && bg.type === "image" && bg.image) {
    node.style.background = "#000"; const img = document.createElement("img"); img.className = "adbgimg";
    img.src = bg.image; img.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0"; node.prepend(img);

  else node.style.background = (bg && bg.c1) || "#151830";
}

  if (e.type === "image") {

  node.style.fontSize = (e.fs || 20) + "px"; node.style.fontWeight = e.weight || "400"; node.style.color = e.color || "#fff";
  node.style.fontFamily = fontCss(e.font); node.style.textAlign = e.align || "center";
  if (e.type === "button") {
